<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>AI Chat</h2>
        <button id="newChatBtn" class="btn-primary">新对话</button>
      </div>
      <div class="conversation-list" id="conversationList"></div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 顶部工具栏 -->
      <header class="toolbar">
        <div class="toolbar-left">
          <select id="modelSelect" class="select"></select>
        </div>
        <div class="toolbar-right">
          <button id="systemPromptBtn" class="btn-icon" title="系统提示词">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </button>
          <button id="clearBtn" class="btn-icon" title="清空对话">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- 系统提示词面板 -->
      <div id="systemPromptPanel" class="panel hidden">
        <div class="panel-header">
          <h3>系统提示词</h3>
          <button id="closePanelBtn" class="btn-icon">&times;</button>
        </div>
        <textarea id="systemPromptInput" placeholder="设置 AI 的角色和行为，例如：你是一个专业的编程助手..."></textarea>
        <div class="panel-actions">
          <button id="applyPromptBtn" class="btn-primary">应用</button>
        </div>
      </div>

      <!-- 聊天区域 -->
      <div class="chat-container" id="chatContainer">
        <div class="chat-messages" id="chatMessages">
          <div class="welcome-message">
            <h1>AI Chat</h1>
            <p>开始一个新的对话吧</p>
          </div>
        </div>
      </div>

      <!-- 输入区域 -->
      <div class="input-area">
        <!-- 文件信息显示区域 -->
        <div id="fileInfo" class="file-info hidden">
          <div class="file-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
            </svg>
          </div>
          <div class="file-details">
            <span id="fileName" class="file-name"></span>
            <span id="fileSize" class="file-size"></span>
          </div>
          <button id="removeFileBtn" class="btn-icon" title="移除文件">&times;</button>
        </div>

        <!-- 输入框 -->
        <div class="input-wrapper" id="inputWrapper">
          <textarea id="messageInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行，拖拽文件到此处上传)" rows="1"></textarea>
          <button id="sendBtn" class="btn-send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>

        <!-- 拖拽提示 -->
        <div id="dropZone" class="drop-zone hidden">
          <div class="drop-zone-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
            <p>释放文件以上传</p>
            <span>支持 PDF、Word 文件</span>
          </div>
        </div>

        <div class="input-info">
          <span id="tokenInfo"></span>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
